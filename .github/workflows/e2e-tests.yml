name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: [self-hosted, spdk]
    
    strategy:
      matrix:
        config: [block_wal_skiplist, block_wal_stdmap, block_wal_boostmap,
                passthrough_wal_skiplist, passthrough_wal_stdmap, passthrough_wal_boostmap]
        test_type: [basic_functionality, stress_and_latency, concurrent_clients]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    
        
    - name: Run E2E tests
      run: |
        cd tests/e2e
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        python -m pytest test_matrix.py::test_${{ matrix.test_type }} -v --tb=short
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results-${{ matrix.config }}-${{ matrix.test_type }}
        path: tests/e2e/test-results/
        
  e2e-matrix:
    runs-on: [self-hosted, spdk]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Build server
      run: |
        mkdir -p tests/unit/build
        cd tests/unit/build
        cmake -DCMAKE_BUILD_TYPE=Release ../../..
        make -j$(nproc)
        
    - name: Run full E2E test matrix
      run: |
        cd tests/e2e
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        # Run all tests
        python -m pytest test_matrix.py -v --tb=short --junitxml=test-results.xml
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-matrix-results
        path: tests/e2e/test-results.xml 