name: PR Code Coverage Tests

on:
  pull_request:
    branches:
      - main
permissions:
  pull-requests: write  # ✅ Required for sticky-pull-request-comment to work
  
jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        chmod +x scripts/install_system_dependencies.sh
        sudo bash scripts/install_system_dependencies.sh

    - name: Run Unit Tests
      run: |
        chmod +x ./tests/unit/run_tests.sh
        tests/unit/run_tests.sh
    - name: Save coverage summary to coverage.txt
      if: always()
      run: |
        if [ -f tests/unit/build/coverage.info ]; then
          lcov --list tests/unit/build/coverage.info | tee tests/unit/build/coverage.txt
        else
          echo "⚠️ coverage.info not found." | tee tests/unit/build/coverage.txt
        fi

    - name: Upload Coverage Report (HTML)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: tests/unit/build/coverage_report/

    - name: Upload LCOV File and Summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lcov-data
        path: |
          tests/unit/build/coverage.info
          tests/unit/build/coverage.txt

    - name: Read coverage.txt into env var
      if: always()
      id: covsummary
      run: |
        {
          echo "summary<<EOF"
          tail -n 20 tests/unit/build/coverage.txt || echo "coverage.txt not found"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Debug Output
      run: echo "${{ steps.covsummary.outputs.summary }}"

    - name: "PR Comment: Coverage Summary"
      if: always()
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: coverage-summary
        message: |
          ✅ **Unit tests passed.**

          📊 **Coverage Summary:**
          ```
          ${{ steps.covsummary.outputs.summary }}
          ```
